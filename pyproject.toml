[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadeye"
version = "0.1.0"
description = "DeadEye: a reproducible benchmark for turning open-weight language models into decision-making policies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DeadEye contributors" }]
keywords = ["llm", "decision-making", "benchmark", "bandits", "reinforcement-learning", "scaling"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# Local Hugging Face backend (prompting, logit scoring, hidden-state probes, LoRA).
hf = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.30", "peft>=0.12", "safetensors>=0.4", "tokenizers>=0.19"]
# 4/8-bit loading on CUDA.
quant = ["bitsandbytes>=0.43"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
all = ["deadeye[hf,dev]"]

[project.scripts]
deadeye = "deadeye.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 600
