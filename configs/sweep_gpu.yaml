# Phase 2 main sweep: the within-family scale ladders on a GPU box (>= 24 GB; 32B/72B in 4-bit need ~45 GB).
# Budget: run `deadeye estimate configs/sweep_gpu.yaml --seconds-per-decision 0.4` for a first-order estimate.
# Split across machines with --only-model; cells are resumable.
name: sweep_gpu
output_dir: results/sweep_gpu
seeds: {start: 0, n: 100}
train_seeds: {start: 100000, n: 100}
illegal_action: random_fallback
envs:
  - {name: bandit, params: {n_arms: 5, horizon: 50, gap: 0.2}}
  - {name: contextual_bandit, params: {n_actions: 3, dim: 4, horizon: 30}}
  - {name: loan, params: {n_applicants: 20}}
  - {name: gridworld, params: {size: 6}}
  - {name: tictactoe, params: {opponent: random}}
  - {name: blackjack, n_episodes: 300}
models:
  # --- Qwen2.5 ladder: base + instruct at every size (H1, H2) ---
  - {backend: hf, id: Qwen/Qwen2.5-0.5B-Instruct}
  - {backend: hf, id: Qwen/Qwen2.5-0.5B}
  - {backend: hf, id: Qwen/Qwen2.5-1.5B-Instruct}
  - {backend: hf, id: Qwen/Qwen2.5-1.5B}
  - {backend: hf, id: Qwen/Qwen2.5-3B-Instruct}
  - {backend: hf, id: Qwen/Qwen2.5-3B}
  - {backend: hf, id: Qwen/Qwen2.5-7B-Instruct}
  - {backend: hf, id: Qwen/Qwen2.5-7B}
  - {backend: hf, id: Qwen/Qwen2.5-14B-Instruct}
  - {backend: hf, id: Qwen/Qwen2.5-14B}
  - {backend: hf, id: Qwen/Qwen2.5-32B-Instruct, quantization: int4}
  - {backend: hf, id: Qwen/Qwen2.5-72B-Instruct, quantization: int4}
  # --- Qwen3 ladder, thinking off (H1) and on (H7) ---
  - {backend: hf, id: Qwen/Qwen3-0.6B, chat_template_kwargs: {enable_thinking: false}, label: Qwen3-0.6B-nothink}
  - {backend: hf, id: Qwen/Qwen3-1.7B, chat_template_kwargs: {enable_thinking: false}, label: Qwen3-1.7B-nothink}
  - {backend: hf, id: Qwen/Qwen3-4B, chat_template_kwargs: {enable_thinking: false}, label: Qwen3-4B-nothink}
  - {backend: hf, id: Qwen/Qwen3-8B, chat_template_kwargs: {enable_thinking: false}, label: Qwen3-8B-nothink}
  - {backend: hf, id: Qwen/Qwen3-14B, chat_template_kwargs: {enable_thinking: false}, label: Qwen3-14B-nothink}
  - {backend: hf, id: Qwen/Qwen3-32B, chat_template_kwargs: {enable_thinking: false}, quantization: int4, label: Qwen3-32B-nothink}
  # --- SmolLM2 (sub-1B) and Gemma 3 ladders (family robustness) ---
  - {backend: hf, id: HuggingFaceTB/SmolLM2-135M-Instruct}
  - {backend: hf, id: HuggingFaceTB/SmolLM2-360M-Instruct}
  - {backend: hf, id: HuggingFaceTB/SmolLM2-1.7B-Instruct}
  - {backend: hf, id: google/gemma-3-270m-it}
  - {backend: hf, id: google/gemma-3-1b-it}
  - {backend: hf, id: google/gemma-3-4b-it}
  - {backend: hf, id: google/gemma-3-12b-it}
  - {backend: hf, id: google/gemma-3-27b-it, quantization: int4}
methods:
  - {name: prompt_generate, params: {max_new_tokens: 16}}
  - {name: prompt_generate, params: {max_new_tokens: 256, cot: true}, label: prompt_generate_cot}
  - {name: prompt_score}
  - {name: probe, params: {layer: mid, n_train_episodes: 100}}
  - {name: feature_probe, params: {n_train_episodes: 100}}
  - {name: lora_sft, params: {n_train_episodes: 100, infer: score, lora: {r: 16, alpha: 32, epochs: 2, lr: 0.0002, batch_size: 8}}}
baselines: [random, oracle, ucb1]
