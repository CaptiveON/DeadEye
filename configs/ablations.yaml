# Phase 3 ablations on three sizes of one ladder. Each block isolates one factor; everything else is held at
# the sweep defaults. Run blocks separately with --only-method / --only-env to spread across machines.
name: ablations
output_dir: results/ablations
seeds: {start: 0, n: 100}
train_seeds: {start: 100000, n: 100}
envs:
  - {name: bandit, params: {n_arms: 5, horizon: 50, gap: 0.2}}
  - {name: bandit, params: {n_arms: 5, horizon: 50, gap: 0.2, history_format: raw}, label: bandit_rawhist}     # observation format
  - {name: bandit, params: {n_arms: 10, horizon: 100, gap: 0.2}, label: bandit_hard}                             # action-space size / horizon
  - {name: contextual_bandit, params: {n_actions: 3, dim: 4, horizon: 30}}
  - {name: loan, params: {n_applicants: 20}}
  # OOD variants (H3): probes, LoRA and few-shot demos are trained on the in-distribution task (train_params) and
  # evaluated on the shifted one, so the adaptation methods really are out of distribution here.
  - {name: loan, params: {n_applicants: 20, shift: covariate}, train_params: {n_applicants: 20, shift: none}, label: loan_covariate_shift}
  - {name: loan, params: {n_applicants: 20, shift: sign_flip}, train_params: {n_applicants: 20, shift: none}, label: loan_sign_flip}
  - {name: gridworld, params: {size: 6}}
  - {name: gridworld, params: {size: 9, n_walls: 16}, label: gridworld_large}                                    # horizon / planning depth
  - {name: tictactoe, params: {opponent: random}}
  - {name: tictactoe, params: {opponent: minimax}, label: tictactoe_minimax}                                     # adversary strength
  - {name: blackjack, n_episodes: 300}
models:
  - {backend: hf, id: Qwen/Qwen2.5-1.5B-Instruct, label: q1.5b-bf16}
  - {backend: hf, id: Qwen/Qwen2.5-1.5B-Instruct, quantization: int8, label: q1.5b-int8}                        # quantisation (H5)
  - {backend: hf, id: Qwen/Qwen2.5-1.5B-Instruct, quantization: int4, label: q1.5b-int4}
  - {backend: hf, id: Qwen/Qwen2.5-7B-Instruct, label: q7b-bf16}
  - {backend: hf, id: Qwen/Qwen2.5-7B-Instruct, quantization: int8, label: q7b-int8}
  - {backend: hf, id: Qwen/Qwen2.5-7B-Instruct, quantization: int4, label: q7b-int4}
  - {backend: hf, id: Qwen/Qwen2.5-14B-Instruct, label: q14b-bf16}
  - {backend: hf, id: Qwen/Qwen2.5-14B-Instruct, quantization: int4, label: q14b-int4}
  - {backend: hf, id: Qwen/Qwen3-4B, chat_template_kwargs: {enable_thinking: false}, label: Qwen3-4B-nothink}    # thinking (H7)
  - {backend: hf, id: Qwen/Qwen3-4B, chat_template_kwargs: {enable_thinking: true}, label: Qwen3-4B-think}
  - {backend: hf, id: Qwen/Qwen3-8B, chat_template_kwargs: {enable_thinking: false}, label: Qwen3-8B-nothink}
  - {backend: hf, id: Qwen/Qwen3-8B, chat_template_kwargs: {enable_thinking: true}, label: Qwen3-8B-think}
methods:
  - {name: prompt_generate, params: {max_new_tokens: 16}}
  - {name: prompt_generate, params: {max_new_tokens: 16, few_shot: 3}, label: gen_fewshot3}                      # demonstrations
  - {name: prompt_generate, params: {max_new_tokens: 256, cot: true}, label: gen_cot}                            # chain of thought
  - {name: prompt_generate, params: {max_new_tokens: 2048, cot: true}, label: gen_cot_long}                      # thinking budget (Qwen3-think)
  - {name: prompt_generate, params: {max_new_tokens: 16, temperature: 0.7}, label: gen_temp0.7}                  # decoding
  - {name: prompt_generate, params: {max_new_tokens: 16, action_format: letter}, label: gen_letter}              # action encoding
  - {name: prompt_score}
  - {name: prompt_score, params: {action_format: letter}, label: score_letter}
  - {name: prompt_score, params: {length_norm: true}, label: score_lengthnorm}
  - {name: probe, params: {layer: mid, n_train_episodes: 100}}
  - {name: probe, params: {layer: last, n_train_episodes: 100}, label: probe_last}                               # layer
  - {name: probe, params: {layer: mid, n_train_episodes: 10}, label: probe_n10}                                  # data budget
  - {name: probe, params: {layer: mid, n_train_episodes: 40}, label: probe_n40}
  - {name: lora_sft, params: {n_train_episodes: 10, lora: {r: 16, epochs: 2}}, label: lora_n10}
  - {name: lora_sft, params: {n_train_episodes: 40, lora: {r: 16, epochs: 2}}, label: lora_n40}
  - {name: lora_sft, params: {n_train_episodes: 100, lora: {r: 16, epochs: 2}}, label: lora_n100}
baselines: [random, oracle, ucb1]
