# Phase 1 pilot: sub-2B models on a CPU laptop (or any GPU). Shortened horizons keep it to a few hours.
# Run:  deadeye run configs/pilot_cpu.yaml            (resumable; add --only-model <id> to run one model at a time)
# Then: deadeye report results/pilot_cpu --out report/pilot_cpu
name: pilot_cpu
output_dir: results/pilot_cpu
seeds: {start: 0, n: 20}
train_seeds: {start: 100000, n: 40}
illegal_action: random_fallback
envs:
  - {name: bandit, params: {n_arms: 5, horizon: 30, gap: 0.2}}
  - {name: contextual_bandit, params: {n_actions: 3, dim: 4, horizon: 20}}
  - {name: loan, params: {n_applicants: 10}}
  - {name: gridworld, params: {size: 5}}
  - {name: tictactoe, params: {opponent: random}}
  - {name: blackjack, n_episodes: 40}
models:
  - {backend: hf, id: HuggingFaceTB/SmolLM2-135M-Instruct, dtype: float32}
  - {backend: hf, id: HuggingFaceTB/SmolLM2-360M-Instruct, dtype: float32}
  - {backend: hf, id: HuggingFaceTB/SmolLM2-360M, dtype: float32}              # base counterpart (H2)
  - {backend: hf, id: Qwen/Qwen2.5-0.5B-Instruct, dtype: float32}
  - {backend: hf, id: Qwen/Qwen2.5-0.5B, dtype: float32}                       # base counterpart (H2)
  - {backend: hf, id: Qwen/Qwen3-0.6B, dtype: float32, chat_template_kwargs: {enable_thinking: false}}
  - {backend: hf, id: Qwen/Qwen2.5-1.5B-Instruct, dtype: float32}
  - {backend: hf, id: HuggingFaceTB/SmolLM2-1.7B-Instruct, dtype: float32}
  - {backend: hf, id: Qwen/Qwen3-1.7B, dtype: float32, chat_template_kwargs: {enable_thinking: false}}
methods:
  - {name: prompt_generate, params: {max_new_tokens: 16}}
  - {name: prompt_score}
  - {name: probe, params: {layer: mid, n_train_episodes: 40}}
  - {name: feature_probe, params: {n_train_episodes: 40}}
baselines: [random, oracle, ucb1]
