# Ablation block: adaptation data budget and probe layer (H3) on the three smallest Qwen2.5-Instruct rungs. 50 episodes.
name: ablations_adaptation
output_dir: results/ablations/adaptation
seeds: {start: 0, n: 50}
train_seeds: {start: 100000, n: 100}
envs:
  - {name: bandit, params: {n_arms: 5, horizon: 50, gap: 0.2}}
  - {name: contextual_bandit, params: {n_actions: 3, dim: 4, horizon: 30}}
  - {name: loan, params: {n_applicants: 20}}
  - {name: gridworld, params: {size: 6}}
  - {name: tictactoe, params: {opponent: random}, n_episodes: 150}
  - {name: blackjack, params: {hands_per_episode: 20}, n_episodes: 50}
  - {name: support, params: {n_tickets: 20}}
models:
  - {backend: hf, id: Qwen/Qwen2.5-0.5B-Instruct}
  - {backend: hf, id: Qwen/Qwen2.5-1.5B-Instruct}
  - {backend: hf, id: Qwen/Qwen2.5-3B-Instruct}
methods:
  - {name: probe, params: {layer: mid, n_train_episodes: 10}, label: probe_n10}
  - {name: probe, params: {layer: mid, n_train_episodes: 40}, label: probe_n40}
  - {name: probe, params: {layer: mid, n_train_episodes: 100}, label: probe_n100}
  - {name: probe, params: {layer: last, n_train_episodes: 100}, label: probe_last_n100}
  - {name: probe, params: {layer: 4, n_train_episodes: 100}, label: probe_layer4_n100}
  - {name: feature_probe, params: {n_train_episodes: 100}}
  - {name: lora_sft, params: {n_train_episodes: 10, max_train_states: 3000, lora: {r: 16, alpha: 32, epochs: 2}}, label: lora_n10}
  - {name: lora_sft, params: {n_train_episodes: 40, max_train_states: 3000, lora: {r: 16, alpha: 32, epochs: 2}}, label: lora_n40}
baselines: [random, oracle, ucb1]
