# Ablation block: quantisation (H5) on Apple silicon. 16-bit weights through the local backend against Q8_0 and
# Q4_K_M GGUF files served by llama.cpp (Metal) through the OpenAI-compatible backend, so only generation and
# first-token letter scoring apply. Start one llama-server per quantisation, e.g.
#   llama-server -m Qwen2.5-7B-Instruct-Q4_K_M.gguf --port 8081 -ngl 99
# and point the base_url below at it. 50 episodes.
name: ablations_quantisation
output_dir: results/ablations/quantisation
seeds: {start: 0, n: 50}
train_seeds: {start: 100000, n: 100}
envs:
  - {name: bandit, params: {n_arms: 5, horizon: 50, gap: 0.2}}
  - {name: contextual_bandit, params: {n_actions: 3, dim: 4, horizon: 30}}
  - {name: loan, params: {n_applicants: 20}}
  - {name: gridworld, params: {size: 6}}
  - {name: tictactoe, params: {opponent: random}, n_episodes: 150}
  - {name: blackjack, params: {hands_per_episode: 20}, n_episodes: 50}
  - {name: support, params: {n_tickets: 20}}
models:
  - {backend: hf, id: Qwen/Qwen2.5-1.5B-Instruct, label: q1.5b-16bit}
  - {backend: openai, id: qwen2.5-1.5b-instruct-q8_0, base_url: "http://127.0.0.1:8080/v1", params: 1540000000, family: qwen2.5, instruct: true, precision: Q8_0, label: q1.5b-q8}
  - {backend: openai, id: qwen2.5-1.5b-instruct-q4_k_m, base_url: "http://127.0.0.1:8081/v1", params: 1540000000, family: qwen2.5, instruct: true, precision: Q4_K_M, label: q1.5b-q4}
  - {backend: hf, id: Qwen/Qwen2.5-3B-Instruct, label: q3b-16bit}
  - {backend: openai, id: qwen2.5-3b-instruct-q8_0, base_url: "http://127.0.0.1:8082/v1", params: 3090000000, family: qwen2.5, instruct: true, precision: Q8_0, label: q3b-q8}
  - {backend: openai, id: qwen2.5-3b-instruct-q4_k_m, base_url: "http://127.0.0.1:8083/v1", params: 3090000000, family: qwen2.5, instruct: true, precision: Q4_K_M, label: q3b-q4}
  - {backend: hf, id: Qwen/Qwen2.5-7B-Instruct, label: q7b-16bit}
  - {backend: openai, id: qwen2.5-7b-instruct-q8_0, base_url: "http://127.0.0.1:8084/v1", params: 7620000000, family: qwen2.5, instruct: true, precision: Q8_0, label: q7b-q8}
  - {backend: openai, id: qwen2.5-7b-instruct-q4_k_m, base_url: "http://127.0.0.1:8085/v1", params: 7620000000, family: qwen2.5, instruct: true, precision: Q4_K_M, label: q7b-q4}
methods:
  - {name: prompt_generate, params: {max_new_tokens: 16}}
  - {name: prompt_score, params: {action_format: letter}, label: score_letter}
baselines: [random, oracle, ucb1]
