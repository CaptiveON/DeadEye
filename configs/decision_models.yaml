# Comparison with decision models that run on the laptop (RQ5, exploratory): Kev 0.8B and 4B through Kev's local server,
# Laya through its package, SemIf on Qwen3.5-4B, against our own conversions of the same Qwen3.5 bases. The Qwen2.5 and
# Qwen3 rows come from results/mac_main at report time:
#   deadeye report results/mac_main results/mac_lora results/decision_models --out report/comparison
# Servers: Kev   uv run --extra serve python -m kev.serve --run jaredpalmer/kev-0.8b --port 8009   (and kev-4b on 8010)
#          Laya  its Python package; if its HTTP schema differs from the System One protocol, add the adapter noted in
#                src/deadeye/models/decision_api.py.    SemIf: its server, or rely on the score_letter row (same readout).
# The hosted decision models (Clef, Clef-flash, Perplexity's decider, Jev) and Kev 9B/27B are future work.
name: decision_models
output_dir: results/decision_models
seeds: {start: 0, n: 100}
train_seeds: {start: 100000, n: 100}
envs:
  - {name: bandit, params: {n_arms: 5, horizon: 50, gap: 0.2}}
  - {name: contextual_bandit, params: {n_actions: 3, dim: 4, horizon: 30}}
  - {name: loan, params: {n_applicants: 20}}
  - {name: gridworld, params: {size: 6}}
  - {name: tictactoe, params: {opponent: random}, n_episodes: 300}
  - {name: blackjack, params: {hands_per_episode: 20}, n_episodes: 100}
  - {name: support, params: {n_tickets: 20}}
models:
  - {backend: decision, id: kev-latest, base_url: "http://127.0.0.1:8009/v1/systemone", params: 800000000, family: kev, label: kev-0.8b}
  - {backend: decision, id: kev-latest, base_url: "http://127.0.0.1:8010/v1/systemone", params: 4000000000, family: kev, label: kev-4b}
  - {backend: decision, id: laya-typed-decisions, base_url: "http://127.0.0.1:8020/v1/systemone", params: 421000000, family: laya, label: laya-typed-decisions}
  - {backend: decision, id: laya, base_url: "http://127.0.0.1:8021/v1/systemone", params: 421000000, family: laya, label: laya}
  - {backend: decision, id: semif-qwen3.5-4b, base_url: "http://127.0.0.1:8030/v1/systemone", params: 4000000000, family: semif, label: semif-qwen3.5-4b}
  # our conversions of the bases the decision models are built on (confirm the repo ids on the hub before running)
  - {backend: hf, id: Qwen/Qwen3.5-0.8B-Base, params: 800000000, family: qwen3.5, instruct: false}
  - {backend: hf, id: Qwen/Qwen3.5-4B-Base, params: 4000000000, family: qwen3.5, instruct: false}
methods:
  - {name: prompt_score}
  - {name: prompt_score, params: {action_format: letter}, label: score_letter}
  - {name: probe, params: {layer: mid, n_train_episodes: 100}}
  - {name: lora_sft, params: {n_train_episodes: 40, max_train_states: 3000, infer: score, lora: {r: 16, alpha: 32, epochs: 2, lr: 0.0002, batch_size: 8}}}
baselines: [random, oracle, ucb1]
