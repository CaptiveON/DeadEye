# Control ladders (optional; run when time allows): Pythia, the pure-parameter control with identical data at every
# size, and OLMo 2, fully open data and recipe. Pythia 6.9B/12B and OLMo 2 13B/32B are future work.
name: mac_controls
output_dir: results/mac_controls
seeds: {start: 0, n: 100}
train_seeds: {start: 100000, n: 100}
envs:
  - {name: bandit, params: {n_arms: 5, horizon: 50, gap: 0.2}}
  - {name: contextual_bandit, params: {n_actions: 3, dim: 4, horizon: 30}}
  - {name: loan, params: {n_applicants: 20}}
  - {name: gridworld, params: {size: 6}}
  - {name: tictactoe, params: {opponent: random}, n_episodes: 300}
  - {name: blackjack, params: {hands_per_episode: 20}, n_episodes: 100}
  - {name: support, params: {n_tickets: 20}}
models:
  - {backend: hf, id: EleutherAI/pythia-70m-deduped}
  - {backend: hf, id: EleutherAI/pythia-160m-deduped}
  - {backend: hf, id: EleutherAI/pythia-410m-deduped}
  - {backend: hf, id: EleutherAI/pythia-1b-deduped}
  - {backend: hf, id: EleutherAI/pythia-1.4b-deduped}
  - {backend: hf, id: EleutherAI/pythia-2.8b-deduped}
  - {backend: hf, id: allenai/OLMo-2-0425-1B}
  - {backend: hf, id: allenai/OLMo-2-0425-1B-Instruct}
  - {backend: hf, id: allenai/OLMo-2-1124-7B}
  - {backend: hf, id: allenai/OLMo-2-1124-7B-Instruct}
methods:
  - {name: prompt_generate, params: {max_new_tokens: 16}}
  - {name: prompt_score}
  - {name: probe, params: {layer: mid, n_train_episodes: 100}}
  - {name: feature_probe, params: {n_train_episodes: 100}}
baselines: [random, oracle, ucb1]
